[build-system]
requires = ["meson-python>=0.15", "pybind11"]
build-backend = "mesonpy"

[project]
name = "layrics"
version = "0.1.0"
description = "Desktop lyrics overlay for Wayland — auto-synced with MPRIS players, rendered via libass on wlr-layer-shell"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}
dependencies = [
    "httpx[brotli,http2]",
    "dbus-python",
    "PyGObject",
    "click>=8.4.1",
    "diskcache",
    "pyaes",
    "appdirs",
]

[project.scripts]
layrics = "layrics.main:main"
layctl = "layrics.layctl:cli"

[dependency-groups]
# the build tools are here because build isolation is disabled for layrics (see tool.uv)
dev = [
    "meson-python>=0.15",
    "pybind11>=2.12",
    "meson>=1.2.3",
    "pytest>=9.1.1",
]

[tool.uv]
# meson-python rebuilds the extension on import, and meson bakes its own path into build.ninja: under
# build isolation that path points into a temporary build environment that is deleted by then, so the
# build tools have to come from this venv instead
no-build-isolation-package = ["layrics"]

[tool.meson-python.args]
setup = ["-Dbuildtype=release"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff.lint]
ignore = ["BLE001"]
