[build-system]
requires = ["meson-python>=0.15", "pybind11"]
build-backend = "mesonpy"

[project]
name = "layrics"
version = "0.1.0"
description = "Desktop lyrics overlay for Wayland — auto-synced with MPRIS players, rendered via libass on wlr-layer-shell"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}
dependencies = [
    "httpx[brotli,http2]",
    "dbus-python",
    "PyGObject",
    "click>=8.4.1",
    "diskcache",
    "pyaes",
    "appdirs",
]

[project.scripts]
layrics = "layrics.main:main"
layctl = "layrics.layctl:cli"

[tool.meson-python.args]
setup = ["-Dbuildtype=release"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff.lint]
ignore = ["BLE001"]
