[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layrics"
version = "0.1.0"
description = "Desktop lyrics overlay for Wayland — auto-synced with MPRIS players, rendered via libass on wlr-layer-shell"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}
dependencies = [
    "asslayer>=0.2.0,<0.3.0",
    "httpx[brotli,http2]",
    "dbus-python",
    "PyGObject",
    "click>=8.4.1",
    "diskcache",
    "pyaes",
    "appdirs",
    "kara-templater>=1.2.2,<2",
]

[project.scripts]
layrics = "layrics.main:main"
layctl = "layrics.layctl:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["layrics"]

[tool.hatch.build.targets.sdist]
include = ["/layrics", "/examples/config.toml", "/layrics.desktop", "/LICENSE", "/README.md"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff.lint]
ignore = ["BLE001"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
kara-templater = { index = "pypi" }
