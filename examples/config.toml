# layrics 配置文件
# 路径: $XDG_CONFIG_HOME/layrics/config.toml 或 ~/.config/layrics/config.toml
# 以下为所有配置项及其默认值。将此文件按需修改后放入配置目录即可生效。

# 歌词搜索源
# 排序决定展示优先级，空列表则默认用 [QM, NE]
# 可选: QM, KG, NE, LRCLIB
[search]
sources = ["QM", "NE"]

# 渲染相关
# 目标帧率, -1 表示跟随显示器刷新率
[overlay]
target_fps = -1

# 忽略的 MPRIS 播放器(使用 layctl players 查看当前 mpris 实例)
# eg: bus_name: "org.mpris.MediaPlayer2.firefox.instance_1_2345" -> "firefox"
#               "org.mpris.MediaPlayer2.mpd"                     -> "mpd"
[mpris]
exclude = []

# MPD 直连
# host 为纯地址: 主机名 / "/unix/socket" / "@abstract"
# 环境变量优先: MPD_HOST / MPD_PORT / MPD_PASSWORD 覆盖对应字段
[mpd]
# host = "127.0.0.1"
# port = 6600
# password = ""

# 字体映射: 检测到的语言 → 字体名
# 语言: ja (日语), zh (中文), ko (韩语), en (英语), default
[fonts]
default = "sans-serif"
ja = "Noto Sans CJK JP"
zh = "Noto Sans CJK SC"

# ASS 主样式覆盖
[style.primary]
font_name = "sans-serif"
font_size = 48
primary_colour = "&H00FCDD1C"
secondary_colour = "&H00FFFFFF"
outline_colour = "&H005C3317"
back_colour = "&H4C000000"
bold = false
italic = false
underline = false
strike_out = false
scale_x = 100
scale_y = 100
spacing = 0
angle = 0
border_style = 1
outline = 3
shadow = 1
alignment = 2
margin_l = 480
margin_r = 480
margin_v = 64
encoding = 1

# ASS 副样式覆盖
[style.secondary]
font_name = "sans-serif"
font_size = 32
primary_colour = "&H00D5D1CF"
secondary_colour = "&H00C0C0C0"
outline_colour = "&H005C3317"
back_colour = "&H4C000000"
bold = false
italic = false
underline = false
strike_out = false
scale_x = 100
scale_y = 100
spacing = 0
angle = 0
border_style = 1
outline = 1.5
shadow = 1
alignment = 2
margin_l = 480
margin_r = 480
margin_v = 24
encoding = 1

# 主/副歌词选择优先级
# 每项可以是 track 类型 (orig, ts, roma) 或语言代码 (zh, ja, ko, en)
# 从左到右优先级依次降低
[lyrics]
primary = ["orig"]
secondary = ["ts"]

# ASS 生成器配置
[assprovider.default]
karaoke = true
line_mode = "single"
secondary = true
# aegisub 卡拉OK模板模式（需要 aegisub-cli: https://github.com/Myaamori/aegisub-cli）
# 仅当歌词带逐字时间轴时生效
# aegisub_karaoke = false
# aegisub_cli = ""
# aegisub_automation = ""

# layctl dmenu 使用的菜单程序
# 可带参数，如 "rofi -dmenu"、"fuzzel --dmenu"、"bemenu"
# 也可通过环境变量 LAYRICS_DMENU 覆盖
[dmenu]
program = "dmenu"

# 单行模式设置
# margin_v_bottom: 副歌词不存在时主歌词的底部边距
[assprovider.default.single]
margin_v_bottom = 32

# 双行模式设置
# advance_ms: 歌词最大提前显示时间
# margin_v_right: 右列底部边距
# v_spacing: 两列垂直间距（字体高度+实际间距）
# margin_l: 左列左边距
# margin_r: 右列右边距
# max_length: 每列最大宽度
[assprovider.default.double]
advance_ms = 5000
margin_v_right = 24
v_spacing = 64
margin_l = 480
margin_r = 480
max_length = 1280
